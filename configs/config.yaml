# ─────────────────────────────────────────────────
#  CIFAR-10 CNN Classifier - Configuration
# ─────────────────────────────────────────────────

data:
  dataset: cifar10
  data_dir: ./data
  num_workers: 2
  augmentation: true

model:
  num_classes: 10
  dropout: 0.4

training:
  epochs: 30
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0005
  optimizer: adam
  scheduler: cosine
  early_stopping_patience: 10

paths:
  checkpoints: ./checkpoints
  logs: ./logs
  results: ./results

seed: 42
